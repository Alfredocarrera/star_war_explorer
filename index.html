<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Explorer</title>
    <!-- Asegúrate de que la ruta coincida con tu carpeta CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="header">
        <div class="nav-container">

            <a href="#" class="logo">STAR <span>WARS</span></a>

            <!-- Control del Menú Hamburguesa -->
            <input type="checkbox" id="menu-toggle" class="menu-checkbox">
            <label for="menu-toggle" class="hamburger" aria-label="Abrir menú">
                <img src="./icono/logo hamburguesa.png" alt="Menú Clone Trooper" class="helmet-icon">
            </label>

            <!-- Menú de navegación (hermano directo del checkbox) -->
            <ul class="nav-links">
                <li><a href="#" data-recurso="films" class="nav-link active">Películas</a></li>
                <li><a href="#" data-recurso="people" class="nav-link">Personajes</a></li>
                <li><a href="#" data-recurso="planets" class="nav-link">Planetas</a></li>
                <li><a href="#" data-recurso="starships" class="nav-link">Naves</a></li>
                <li><a href="#" data-recurso="species" class="nav-link">Especies</a></li>
                <li><a href="#" data-recurso="vehicles" class="nav-link">Vehículos</a></li>
            </ul>

        </div> <!-- Fin de nav-container -->

        <!-- Buscador general -->
        <div id="buscador" class="search-container">
            <input type="text" id="dato_busqueda" placeholder="Buscar en la galaxia...">
            <button id="buscar">Buscar</button>
        </div>
    </header> <!-- Cierre del header arreglado -->

    <main class="main-content">

        <!-- Contenedor dinámico donde JavaScript renderizará los datos -->
        <section class="film-container">

            <!-- Skeleton inicial mientras carga la API -->
            <article class="skeleton">
                <div class="skeleton-media"></div>
                <div class="skeleton-title"></div>
                <div class="skeleton-text"></div>
                <div class="skeleton-text"></div>
            </article>

            <article class="skeleton">
                <div class="skeleton-media"></div>
                <div class="skeleton-title"></div>
                <div class="skeleton-text"></div>
                <div class="skeleton-text"></div>
            </article>

            <article class="skeleton">
                <div class="skeleton-media"></div>
                <div class="skeleton-title"></div>
                <div class="skeleton-text"></div>
                <div class="skeleton-text"></div>
            </article>

        </section>
    </main>

    <!-- Conexión con JavaScript (cambia la ruta si tu archivo está en la raíz) -->
    <script src="./js/coneccionApi.js"></script>
</body>

</html>
